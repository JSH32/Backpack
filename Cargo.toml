[workspace]
members = [".", "migration"]

[package]
name = "backpack"
version = "0.1.0"
authors = ["Riku <riku@kawaii.sh>"]
edition = "2021"

[dependencies.sea-orm]
version = "1.1.14"
features = [
	"sqlx-sqlite",
	"sqlx-mysql",
	"sqlx-postgres",
	"runtime-tokio-rustls",
	"macros",
]

[dependencies]
migration = { path = "migration" }
tokio = { version = "1.14.1", features = ["full"] }
clap = { version = "4.5.42", features = ["derive"] }
serde = "1.0.219"
sqlx = { version = "0.8.4", features = [
	"runtime-tokio-rustls",
	"postgres",
	"chrono",
	"sqlite",
] }
serde_json = { version = "1.0.142", features = ["preserve_order"] }
jsonwebtoken = "9.3.1"
dotenv = "0.15.0"
actix-web = "4.11.0"
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-http = "3.11.0"
utoipa = { version = "2.0.1", features = ["actix_extras"] }
figlet-rs = "0.1.5"
indicatif = "0.18.0"
colored = "3.0.0"
derive_more = "2.0.1"
argon2 = { version = "0.5.3", features = ["std"] }
rusoto_s3 = "0.48.0"
rusoto_core = "0.48.0"
image = "0.25.6"
anyhow = "1.0.98"
log = "0.4.27"
infer = "0.19.0"
rand = "0.9.2"
futures = "0.3.31"
time = "0.3.41"
chrono = "0.4.41"
async-trait = "0.1.88"
env_logger = "0.11.8"
regex = "1.11.1"
lettre = { version = "0.10.0-rc.6", features = ["tokio1-native-tls"] }
thiserror = "2.0.12"
lazy_static = "1.5.0"
nanoid = "0.4.0"
uuid = { version = "1.17.0", features = ["v4"] }
sha2 = "0.10.9"
bytes = "1.10.1"
git-version = "0.3.9"
actix-multipart-extract = "0.1.5"
num_cpus = "1.17.0"
heck = "0.5.0"
oauth2 = "5.0.0"
reqwest = { version = "0.12.22", features = ["json"] }
moka = { version = "0.12.10", features = ["future"] }
url = "2.5.4"
actix-cors = "0.7.1"
once_cell = "1.21.3"
